<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#C2352A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="כפר הדרדסים">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>כפר הדרדסים</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Karantina:wght@400;700&family=Assistant:wght@400;600;700;800&display=swap">
<style>
/* Layout: one centred column (max 900px). A mushroom-cap header carries the name; below it a numbered
   level map (responsive grid of tiles), then the quiz as a single card under a ten-segment progress rail. */
:root{
  --bg:#E8F1F7; --surface:#FFFFFF; --ink:#10293F; --muted:#4A657D; --line:#C2D6E4;
  --blue:#1769C2; --blue-soft:#DCEBFA;
  --violet:#5A35A8; --violet-soft:#E9E1F8;
  --cap:#C2352A; --cap-soft:#FBE4E1; --cap-bg:#C2352A; --on-cap:#FFFFFF; --cap-dot:rgba(255,255,255,.17);
  --leaf:#17733C; --leaf-soft:#DCF1E3;
  --gold:#8A5B00; --gold-soft:#FBEFCB;
  --on-accent:#FFFFFF;
  --accent:var(--blue); --accent-soft:var(--blue-soft);
  --shadow:0 1px 2px rgba(16,41,63,.06),0 8px 24px rgba(16,41,63,.07);
  --font-display:"Karantina","Secular One","Arial Hebrew","Arial",sans-serif;
  --font-body:"Assistant","Heebo","Arial Hebrew","Segoe UI",system-ui,sans-serif;
  --font-emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A1826; --surface:#122A42; --ink:#E9F2FA; --muted:#9DB6CC; --line:#294661;
    --blue:#62B2F6; --blue-soft:#173A5C;
    --violet:#BBA4F4; --violet-soft:#2C2250;
    --cap:#F4827A; --cap-soft:#4A1F1C; --cap-bg:#8E2A22; --on-cap:#FFFFFF; --cap-dot:rgba(255,255,255,.13);
    --leaf:#5BD18E; --leaf-soft:#143D2A;
    --gold:#F2C050; --gold-soft:#3F3212;
    --on-accent:#071C30;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.28);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1826; --surface:#122A42; --ink:#E9F2FA; --muted:#9DB6CC; --line:#294661;
  --blue:#62B2F6; --blue-soft:#173A5C;
  --violet:#BBA4F4; --violet-soft:#2C2250;
  --cap:#F4827A; --cap-soft:#4A1F1C; --cap-bg:#8E2A22; --on-cap:#FFFFFF; --cap-dot:rgba(255,255,255,.13);
  --leaf:#5BD18E; --leaf-soft:#143D2A;
  --gold:#F2C050; --gold-soft:#3F3212;
  --on-accent:#071C30;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.28);
  color-scheme:dark;
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.5;-webkit-text-size-adjust:100%}
#app{max-width:900px;margin-inline:auto;padding-inline:16px;padding-block:18px 48px}
#app[data-world="d"]{--accent:var(--violet);--accent-soft:var(--violet-soft)}
.screen{display:flex;flex-direction:column;gap:18px}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.defs{position:absolute;width:0;height:0;overflow:hidden}

/* apples */
.apple{width:1.25em;height:1.25em;flex:none;color:var(--cap);--apple-leaf:var(--leaf)}
.apple.off{color:var(--line);--apple-leaf:var(--line)}
.a-body{fill:currentColor}
.a-stem{stroke:currentColor}
.a-leaf{fill:var(--apple-leaf)}
.apples{display:inline-flex;gap:2px;align-items:center}

/* header: the mushroom cap */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:22px 24px 20px;border-radius:44px 44px 16px 16px;color:var(--on-cap);
  background-color:var(--cap-bg);
  background-image:
    radial-gradient(circle at 9% 18%,var(--cap-dot) 0 30px,transparent 31px),
    radial-gradient(circle at 34% 108%,var(--cap-dot) 0 44px,transparent 45px),
    radial-gradient(circle at 58% -12%,var(--cap-dot) 0 36px,transparent 37px),
    radial-gradient(circle at 80% 92%,var(--cap-dot) 0 22px,transparent 23px),
    radial-gradient(circle at 96% 20%,var(--cap-dot) 0 26px,transparent 27px)}
.top-text{min-width:0;display:flex;flex-direction:column;gap:2px}
.eyebrow{font-weight:700;font-size:.9rem;opacity:.92}
h1{font-family:var(--font-display);font-weight:700;font-size:clamp(3.2rem,13vw,5.6rem);line-height:.9;letter-spacing:.01em;text-wrap:balance}
.lede{margin-top:8px;max-width:34em;font-size:1rem}
.ruler{flex:none;display:flex;align-items:stretch;gap:8px}
.ruler-apples{display:flex;flex-direction:column;gap:0}
.ruler .apple{width:34px;height:34px;color:var(--on-cap);--apple-leaf:var(--on-cap)}
.ruler-line{width:10px;border-inline-start:2px solid var(--on-cap);border-block:2px solid var(--on-cap);opacity:.85}
.ruler-label{writing-mode:vertical-rl;font-size:.8rem;font-weight:700;letter-spacing:.04em;text-align:center}

/* world tabs */
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tab{display:flex;flex-direction:column;align-items:flex-start;gap:0;padding:10px 16px;border-radius:14px;border:1.5px solid var(--line);background:transparent;cursor:pointer;text-align:start;min-width:0}
.tab strong{font-family:var(--font-display);font-size:1.9rem;line-height:1;font-weight:700}
.tab span{font-size:.85rem;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--surface);border-color:var(--accent);box-shadow:var(--shadow)}
.tab[aria-selected="true"] strong{color:var(--accent)}

/* summary */
.summary{display:flex;flex-direction:column;gap:8px}
.sum-row{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 16px;font-weight:600}
.sum-row .apples-count{display:inline-flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:5px}
.hint{color:var(--muted);font-size:.92rem}
.reset-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.reset-row .ask{font-weight:700}

.resume{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;padding:12px 16px;border-radius:14px;background:var(--gold-soft);border:1.5px solid var(--gold)}
.resume p{min-width:0}
.row{display:flex;flex-wrap:wrap;gap:8px}

/* buttons */
.btn{padding:10px 18px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent}
.btn.small{padding:6px 12px;font-size:.92rem}
.btn:hover{filter:brightness(1.04)}

/* level map */
.levels{list-style:none;margin:0;padding:0;display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(255px,1fr))}
.lv{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:12px;width:100%;height:100%;text-align:start;padding:10px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer}
.lv-num{font-family:var(--font-display);font-weight:700;font-size:2.6rem;line-height:1;min-width:1.25em;text-align:center;color:var(--accent);font-variant-numeric:tabular-nums}
.lv-body{display:flex;flex-direction:column;gap:4px;min-width:0}
.lv-title{font-weight:700;line-height:1.25}
.lv-meta{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:.85rem}
.lv:hover:not([disabled]){border-color:var(--accent)}
.lv.next{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.lv[disabled]{cursor:not-allowed;background:transparent;border-style:dashed}
.lv[disabled] .lv-num,.lv[disabled] .lv-title{color:var(--muted)}
.lock{display:inline-flex;align-items:center;gap:4px;color:var(--muted)}
.lock svg{width:1em;height:1em;fill:currentColor}
.go{font-weight:700;color:var(--accent)}
.chip{padding:1px 9px;border-radius:999px;font-weight:700;font-size:.8rem;white-space:nowrap}
.chip.d1{background:var(--leaf-soft);color:var(--leaf)}
.chip.d2{background:var(--gold-soft);color:var(--gold)}
.chip.d3{background:var(--cap-soft);color:var(--cap)}
.chip.d4{background:var(--ink);color:var(--bg)}

/* footer */
.foot{display:flex;flex-direction:column;gap:12px;padding-top:6px;color:var(--muted);font-size:.95rem}
.gloss{border:1.5px solid var(--line);border-radius:14px;padding:10px 16px;color:var(--ink)}
.gloss summary{cursor:pointer;font-weight:700}
.gloss dl{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:4px 20px;margin:12px 0 4px}
.gloss dl div{display:flex;gap:8px;min-width:0}
.gloss dt{font-weight:700;white-space:nowrap}
.gloss dd{margin:0;color:var(--muted);min-width:0}
.foot-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px}

/* quiz */
.q-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.q-top .btn{flex:none}
.q-level{font-weight:700;min-width:0;text-align:end}
.status{display:flex;flex-direction:column;gap:8px}
.status-row{display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:600;font-variant-numeric:tabular-nums}
.status .apple{width:26px;height:26px}
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px}
.seg{height:8px;border-radius:4px;background:var(--line)}
.seg.ok{background:var(--leaf)}
.seg.bad{background:var(--cap)}
.seg.cur{background:var(--accent)}
.card{display:flex;flex-direction:column;gap:16px;padding:20px;border-radius:20px;background:var(--surface);box-shadow:var(--shadow)}
.clue{display:flex;flex-direction:column;align-items:center;gap:2px;padding:14px 12px 10px;border-radius:14px;background:var(--accent-soft);border:2px dashed var(--accent)}
.clue-emoji{font-family:var(--font-emoji);font-size:clamp(3rem,15vw,4.6rem);line-height:1.15;letter-spacing:.12em;direction:ltr}
.clue-tag{font-size:.8rem;font-weight:700;color:var(--accent);letter-spacing:.04em}
.q-text{font-size:clamp(1.3rem,4.6vw,1.75rem);font-weight:800;line-height:1.25;text-wrap:balance}
.q-text:focus{outline:none}
.opts{display:grid;gap:10px;grid-template-columns:1fr}
@media (min-width:640px){.opts{grid-template-columns:1fr 1fr}}
.opt{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:12px;min-width:0;padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);cursor:pointer;text-align:start;font-weight:600;line-height:1.3}
.opt .k{display:grid;place-items:center;width:1.7em;height:1.7em;border-radius:50%;background:var(--surface);border:1.5px solid var(--line);font-size:.85rem;font-weight:800;font-variant-numeric:tabular-nums}
.opt:hover:not([disabled]){border-color:var(--accent);background:var(--accent-soft)}
.opt[disabled]{cursor:default}
.opt.dim{opacity:.55}
.opt.right{background:var(--leaf-soft);border-color:var(--leaf)}
.opt.right .k{background:var(--leaf);border-color:var(--leaf);color:var(--surface)}
.opt.wrong{background:var(--cap-soft);border-color:var(--cap)}
.opt.wrong .k{background:var(--cap);border-color:var(--cap);color:var(--surface)}
.fb{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;min-height:46px}
.fb-text{min-width:0;flex:1 1 240px}
.verdict{font-weight:800}
.verdict.ok{color:var(--leaf)}
.verdict.no{color:var(--cap)}
.keys-hint{color:var(--muted);font-size:.85rem}
@media (hover:none){.keys-hint{display:none}}

/* result */
.res-head{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:26px 20px;border-radius:20px;background:var(--surface);box-shadow:var(--shadow)}
.res-head .apples{gap:6px}
.res-head .apple{width:58px;height:58px}
.res-title{font-family:var(--font-display);font-weight:700;font-size:clamp(2.8rem,11vw,4.4rem);line-height:.95;text-wrap:balance}
.res-sub{max-width:30em}
.res-unlock{font-weight:700;color:var(--accent)}
.res-head .row{justify-content:center;margin-top:8px}
.review{display:flex;flex-direction:column;gap:10px}
.review h3{font-size:1.05rem}
.review ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.review li{padding:12px 16px;border-radius:12px;border:1.5px solid var(--line);display:flex;flex-direction:column;gap:2px}
.review .rq{font-weight:700}
.review .ra{color:var(--cap)}
.review .rc{color:var(--leaf);font-weight:700}

@media (max-width:480px){
  .top{padding:18px 18px 16px;border-radius:34px 34px 14px 14px}
  .ruler .apple{width:26px;height:26px}
  .card{padding:16px}
}
@media (prefers-reduced-motion:no-preference){
  .opt,.lv,.tab,.btn{transition:border-color .15s,background-color .15s,box-shadow .15s}
  .opt.right{animation:pop .28s ease-out}
  @keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.025)}100%{transform:scale(1)}}
}
</style>
</head>
<body>


<svg class="defs" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="apple" viewBox="0 0 24 24">
      <path class="a-body" d="M12 7.6c-1.7-1.4-4-1.7-5.8-.6C3.9 8.4 3.2 11.3 4 14.3c.8 3.1 3 6.2 5.3 6.2.9 0 1.6-.5 2.7-.5s1.8.5 2.7.5c2.3 0 4.5-3.1 5.3-6.2.8-3 .1-5.9-2.2-7.3-1.8-1.1-4.1-.8-5.8.6z"/>
      <path class="a-stem" d="M12 7.8c0-1.7.5-3.1 1.5-4.2" fill="none" stroke-width="1.6" stroke-linecap="round"/>
      <path class="a-leaf" d="M13.4 4.9c1.1-2 3.1-2.6 4.9-2.1-.4 2-2.1 3.4-4.9 2.1z"/>
    </symbol>
    <symbol id="lock" viewBox="0 0 24 24">
      <path d="M7 10V8a5 5 0 0 1 10 0v2h1.2c.7 0 1.3.6 1.3 1.3v7.4c0 .7-.6 1.3-1.3 1.3H5.8c-.7 0-1.3-.6-1.3-1.3v-7.4c0-.7.6-1.3 1.3-1.3H7zm2.2 0h5.6V8a2.8 2.8 0 0 0-5.6 0v2z"/>
    </symbol>
  </defs>
</svg>

<div id="app" dir="rtl" lang="he" data-world="s">

  <section id="home" class="screen">
    <header class="top">
      <div class="top-text">
        <p class="eyebrow">טריוויה בשלבים, מהקל אל הקשה</p>
        <h1>כפר הדרדסים</h1>
        <p class="lede" id="lede"></p>
      </div>
      <div class="ruler" aria-hidden="true">
        <span class="ruler-label">גובה של דרדס</span>
        <span class="ruler-line"></span>
        <span class="ruler-apples">
          <svg class="apple"><use href="#apple"/></svg>
          <svg class="apple"><use href="#apple"/></svg>
          <svg class="apple"><use href="#apple"/></svg>
        </span>
      </div>
    </header>

    <div class="tabs" role="tablist" aria-label="בחירת עולם">
      <button class="tab" role="tab" id="tab-s" data-world="s" aria-selected="true"><strong>הדרדסים</strong><span id="tab-s-meta"></span></button>
      <button class="tab" role="tab" id="tab-d" data-world="d" aria-selected="false"><strong>דיסני</strong><span id="tab-d-meta"></span></button>
    </div>

    <div class="summary" id="summary"></div>
    <div class="reset-row" id="reset-area"></div>
    <div class="resume" id="resume" hidden></div>
    <ol class="levels" id="levels"></ol>

    <footer class="foot">
      <details class="gloss">
        <summary>מי זה מי: מילון השמות</summary>
        <dl id="gloss"></dl>
      </details>
      <div class="foot-row">
        <span id="save-note">ההתקדמות נשמרת אוטומטית.</span>
      </div>
    </footer>
  </section>

  <section id="quiz" class="screen" hidden>
    <div class="q-top">
      <button class="btn ghost small" id="q-exit">חזרה למפה</button>
      <span class="q-level" id="q-level"></span>
    </div>
    <div class="status">
      <div class="status-row">
        <span id="q-count"></span>
        <span class="apples" id="q-apples" role="img"></span>
      </div>
      <div class="rail" id="q-rail" aria-hidden="true"></div>
    </div>
    <div class="card">
      <div class="clue" id="q-clue" hidden>
        <span class="clue-tag">כרטיס רמז</span>
        <span class="clue-emoji" id="q-emoji" aria-hidden="true"></span>
      </div>
      <h2 class="q-text" id="q-text" tabindex="-1"></h2>
      <div class="opts" id="q-opts"></div>
      <div class="fb">
        <div class="fb-text" id="q-fb" aria-live="polite"><span class="keys-hint">אפשר לענות גם במקשים 1 עד 4.</span></div>
        <button class="btn primary" id="q-next" hidden></button>
      </div>
    </div>
  </section>

  <section id="result" class="screen" hidden>
    <div class="res-head">
      <span class="apples" id="r-apples" role="img"></span>
      <h2 class="res-title" id="r-title" tabindex="-1"></h2>
      <p class="res-sub" id="r-sub"></p>
      <p class="res-unlock" id="r-unlock" hidden></p>
      <div class="row" id="r-actions"></div>
    </div>
    <div class="review" id="r-review" hidden></div>
  </section>

</div>

<script>
// Each question: [text, correct, wrong1, wrong2, wrong3, explanation?, clueEmoji?]
const S = [];

S.push({t:"ברוכים הבאים לכפר", d:1, q:[
["באיזה צבע העור של הדרדסים?","כחול","ירוק","סגול","צהוב"],
["מי המנהיג של כפר הדרדסים?","דרדסאבא","בר-מוח","בר-כוח","גרגמל"],
["באיזה צבע הכובע של דרדסאבא?","אדום","לבן","כחול","צהוב"],
["איך קוראים למכשף הרשע שרודף אחרי הדרדסים?","גרגמל","הומניבוס","פה גדול","ג'ון"],
["איזו חיה הוא חתחתול?","חתול","עורב","כלב","עכברוש"],
["באיזה סוג בתים גרים הדרדסים?","בתים בצורת פטריות","בתי עץ על ענפים","מערות בסלע","אוהלים מעלים"],
["באיזה צבע הכובעים של רוב הדרדסים?","לבן","אדום","כחול","ירוק"],
["מה יש לדרדסאבא על הפנים?","זקן לבן","שפם שחור","משקפיים עגולים","רטייה על העין"],
["איפה מסתתר כפר הדרדסים?","בלב היער","על חוף הים","בראש הר מושלג","באמצע המדבר"],
["מרכיב משקפיים ובטוח שהוא החכם ביותר בכפר. מי זה?","בר-מוח","בר-כוח","ישנוני","קונדסון","","👓📚"]
]});

S.push({t:"מי זה מי", d:1, q:[
["הדרדס החזק ביותר בכפר, עם קעקוע על הזרוע. מי זה?","בר-כוח","בר-מוח","חולמני","נגני","","💪❤️"],
["מחלק לכולם מתנות שמתפוצצות בפרצוף. מי זה?","קונדסון","רגזני","חרוצון","זללני","","🎁💥"],

(function(){
'use strict';

var WORLDS = { s:{name:'הדרדסים', levels:S}, d:{name:'דיסני', levels:D} };
var DIFF = ['', 'קל', 'בינוני', 'קשה', 'מומחים'];
var KEY = 'kfar-hadardasim-v1', RUNKEY = KEY + ':run';
var APPLES = 3;
var CHEERS = ['נכון!', 'בדיוק!', 'יפה מאוד!', 'דרדסי לגמרי!', 'נכון מאוד!'];

var $ = function(id){ return document.getElementById(id); };
var esc = function(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };
var app = $('app');

var P = { lv:{}, rt:0 };          // progress: { s0:{a:apples 0-3, b:best correct}, ... }
var world = 's';
var run = null;             // level in progress
var screen = 'home';
var cloud = { ref:null, busy:false, dirty:false, on:false };

document.documentElement.lang = 'he';
document.documentElement.dir = 'rtl';

/* ---------- storage ---------- */
function clean(lv){
  var out = {};
  ['s','d'].forEach(function(w){
    WORLDS[w].levels.forEach(function(L, i){
      var v = lv && lv[w + i];
      if (v && typeof v === 'object'){
        var a = Math.max(0, Math.min(APPLES, v.a | 0));
        var b = Math.max(0, Math.min(L.q.length, v.b | 0));
        if (a || b) out[w + i] = { a:a, b:b };
      }
    });
  });
  return out;
}
function merge(lv){
  var c = clean(lv), next = {}, k;
  for (k in P.lv) next[k] = { a:P.lv[k].a, b:P.lv[k].b };
  for (k in c){
    var m = next[k] || { a:0, b:0 };
    next[k] = { a:Math.max(m.a, c[k].a), b:Math.max(m.b, c[k].b) };
  }
  P.lv = clean(next);
}
function validRun(o){
  if (!o || !WORLDS[o.w]) return false;
  var L = WORLDS[o.w].levels[o.l];
  if (!L) return false;
  var n = L.q.length;
  return Array.isArray(o.ord) && o.ord.length === n && Array.isArray(o.op) && o.op.length === n &&
    Array.isArray(o.log) && typeof o.i === 'number' && o.i >= 0 && o.i < n &&
    typeof o.miss === 'number' && typeof o.hit === 'number';
}
function loadLocal(){
  try {
    var r = localStorage.getItem(KEY);
    if (r){
      var o = JSON.parse(r);
      if (o && o.lv) P.lv = clean(o.lv);
      if (o && o.rt > 0) P.rt = +o.rt;
      if (o && (o.w === 's' || o.w === 'd')) world = o.w;
    }
  } catch (e) {}
  try {
    var r2 = localStorage.getItem(RUNKEY);
    if (r2){ var o2 = JSON.parse(r2); if (validRun(o2)) run = o2; }
  } catch (e) {}
}
function saveLocal(){ try { localStorage.setItem(KEY, JSON.stringify({ v:1, lv:P.lv, rt:P.rt, w:world })); } catch (e) {} }
function saveRun(){
  try { if (run) localStorage.setItem(RUNKEY, JSON.stringify(run)); else localStorage.removeItem(RUNKEY); } catch (e) {}
}

/* ---------- account sync (signed-in viewers) ---------- */
function pushCloud(){
  if (!cloud.ref) return;
  if (cloud.busy){ cloud.dirty = true; return; }
  cloud.busy = true; cloud.dirty = false;
  cloud.ref.set({ v:1, lv:P.lv, rt:P.rt }).then(function(){
    cloud.busy = false;
    if (cloud.dirty) pushCloud();
  }, function(){
    cloud.busy = false; cloud.ref = null; cloud.on = false; saveNote();
  });
}
function initCloud(){
  var c = window.claude;
  if (!c || typeof c.use !== 'function') return;
  Promise.all([c.use('db'), c.use('user')]).then(function(r){
    var db = r[0], user = r[1];
    if (!db || !user) return null;
    return user.id().then(function(uid){
      if (!uid) return null;
      var ref = db.doc('data/users/' + uid + '/progress');
      return ref.get().then(function(snap){
        var d = snap.exists ? (snap.data() || {}) : {};
        var remote = d.lv || {}, rrt = d.rt > 0 ? +d.rt : 0;
        var before = JSON.stringify(P.lv);
        if (rrt > P.rt){ P.lv = clean(remote); P.rt = rrt; }   // a newer reset happened elsewhere
        else if (rrt === P.rt) merge(remote);                  // same game: keep the best of both
        cloud.ref = ref; cloud.on = true;
        if (run && !unlocked(run.w, run.l)){ run = null; saveRun(); }
        if (JSON.stringify(P.lv) !== before){ saveLocal(); if (screen === 'home') renderHome(); }
        if (JSON.stringify(clean(remote)) !== JSON.stringify(P.lv) || rrt !== P.rt) pushCloud();
        saveNote();
      });
    });
  }).catch(function(){ cloud.ref = null; cloud.on = false; });
}
function saveNote(){
  $('save-note').textContent = cloud.on
    ? 'ההתקדמות נשמרת אוטומטית בחשבון שלך.'
    : 'ההתקדמות נשמרת אוטומטית בדפדפן הזה.';
}

/* ---------- helpers ---------- */
function shuffle(a){
  for (var i = a.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function rec(w, i){ return P.lv[w + i] || { a:0, b:0 }; }
function passed(w, i){ return rec(w, i).a >= 1; }
function unlocked(w, i){ return i === 0 || passed(w, i - 1); }
function applesHTML(n){
  var h = '';
  for (var i = 0; i < APPLES; i++) h += '<svg class="apple' + (i < n ? '' : ' off') + '"><use href="#apple"/></svg>';
  return h;
}
function countQ(w){ return WORLDS[w].levels.reduce(function(s, L){ return s + L.q.length; }, 0); }
function show(id){
  screen = id;
  ['home','quiz','result'].forEach(function(s){ $(s).hidden = s !== id; });
  try { window.scrollTo(0, 0); } catch (e) {}
}

/* ---------- home ---------- */
function renderHome(){
  app.dataset.world = world;
  show('home');
  ['s','d'].forEach(function(w){
    $('tab-' + w).setAttribute('aria-selected', String(w === world));
    $('tab-' + w + '-meta').textContent = WORLDS[w].levels.length + ' שלבים · ' + countQ(w) + ' שאלות';
  });
  $('lede').textContent = (countQ('s') + countQ('d')) + ' שאלות על הדמויות ועל מה שקרה להן. בכל שלב יש לך שלושה תפוחים, וכל טעות עולה תפוח.';

  var L = WORLDS[world].levels, done = 0, got = 0;
  L.forEach(function(_, i){ var r = rec(world, i); got += r.a; if (r.a) done++; });
  var all = done === L.length;
  $('summary').innerHTML =
    '<div class="sum-row"><span>' + (all ? 'כל ' + L.length + ' השלבים הושלמו' : 'עברת ' + done + ' מתוך ' + L.length + ' שלבים') + '</span>' +
    '<span class="apples-count"><svg class="apple"><use href="#apple"/></svg>' + got + ' מתוך ' + (L.length * APPLES) + ' תפוחים</span></div>' +
    '<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="' + L.length + '" aria-valuenow="' + done + '" aria-label="שלבים שהושלמו"><i style="width:' + (100 * done / L.length) + '%"></i></div>' +
    '<p class="hint">שלב נפתח אחרי שעוברים את השלב שלפניו. אפשר לחזור לכל שלב פתוח כדי לאסוף את כל שלושת התפוחים.</p>';

  var h = '';
  L.forEach(function(lv, i){
    var r = rec(world, i), open = unlocked(world, i), isNext = open && !r.a;
    var cls = 'lv' + (r.a ? ' done' : '') + (isNext ? ' next' : '');
    var label = 'שלב ' + (i + 1) + ': ' + lv.t + ', ' + DIFF[lv.d] + ', ' + (open ? (r.a ? r.a + ' מתוך 3 תפוחים' : 'פתוח') : 'נעול');
    var state = !open ? '<span class="lock"><svg><use href="#lock"/></svg>נעול</span>'
      : (r.a ? '<span class="apples">' + applesHTML(r.a) + '</span>' : '<span class="go">לשחק</span>');
    h += '<li><button class="' + cls + '" data-i="' + i + '"' + (open ? '' : ' disabled') + ' aria-label="' + esc(label) + '">' +
      '<span class="lv-num">' + (i + 1) + '</span><span class="lv-body"><span class="lv-title">' + esc(lv.t) + '</span>' +
      '<span class="lv-meta"><span class="chip d' + lv.d + '">' + DIFF[lv.d] + '</span>' + state + '</span></span></button></li>';
  });
  $('levels').innerHTML = h;

  var rs = $('resume');
  if (run){
    var RL = WORLDS[run.w].levels[run.l];
    rs.hidden = false;
    rs.innerHTML = '<p><strong>יש לך שלב באמצע.</strong> ' + esc(WORLDS[run.w].name) + ', שלב ' + (run.l + 1) + ' · ' + esc(RL.t) +
      ', שאלה ' + (run.i + 1) + ' מתוך ' + RL.q.length + '.</p>' +
      '<span class="row"><button class="btn primary small" id="resume-go">להמשיך</button><button class="btn ghost small" id="resume-drop">לוותר עליו</button></span>';
  } else { rs.hidden = true; rs.innerHTML = ''; }

  if (!$('reset-area').firstChild) resetIdle();
  saveNote();
}
function resetIdle(){
  $('reset-area').innerHTML = '<button class="btn ghost small" id="reset-ask">לאפס משחק ולהתחיל מהתחלה</button>';
}
function resetGame(which){
  if (which === 'all') P.lv = {};
  else Object.keys(P.lv).forEach(function(k){ if (k.charAt(0) === which) delete P.lv[k]; });
  if (run && (which === 'all' || run.w === which)){ run = null; saveRun(); }
  P.rt = Date.now();
  saveLocal();
  pushCloud();
}
function renderGloss(){
  $('gloss').innerHTML = GLOSS.map(function(g){ return '<div><dt>' + esc(g[0]) + '</dt><dd>' + esc(g[1]) + '</dd></div>'; }).join('');
}

/* ---------- quiz ---------- */
function startLevel(w, i){
  if (!unlocked(w, i)) return;
  var n = WORLDS[w].levels[i].q.length, ord = [], op = [];
  for (var k = 0; k < n; k++){ ord.push(k); op.push(shuffle([1, 2, 3, 4])); }
  run = { w:w, l:i, ord:shuffle(ord), op:op, i:0, miss:0, hit:0, log:[], pick:null };
  saveRun();
  renderQuiz(true);
}
function renderQuiz(focus){
  var L = WORLDS[run.w].levels[run.l], n = L.q.length, Q = L.q[run.ord[run.i]];
  app.dataset.world = run.w;
  show('quiz');
  $('q-level').textContent = WORLDS[run.w].name + ' · שלב ' + (run.l + 1) + ' · ' + L.t;
  $('q-count').textContent = 'שאלה ' + (run.i + 1) + ' מתוך ' + n;
  $('q-emoji').textContent = Q[6] || '';
  $('q-clue').hidden = !Q[6];
  $('q-text').textContent = Q[0];
  var h = '';
  run.op[run.i].forEach(function(oi, k){
    h += '<button class="opt" data-k="' + k + '"><span class="k">' + (k + 1) + '</span><span>' + esc(Q[oi]) + '</span></button>';
  });
  $('q-opts').innerHTML = h;
  paintStatus();
  if (run.pick !== null && run.pick !== undefined) paintAnswered();
  else {
    $('q-fb').innerHTML = '<span class="keys-hint">אפשר לענות גם במקשים 1 עד 4.</span>';
    $('q-next').hidden = true;
  }
  if (focus) { try { $('q-text').focus({ preventScroll:true }); } catch (e) {} }
}
function paintStatus(){
  var n = WORLDS[run.w].levels[run.l].q.length, left = Math.max(0, APPLES - run.miss), h = '';
  for (var j = 0; j < n; j++){
    var e = run.log[j];
    h += '<span class="seg' + (e ? (e.ok ? ' ok' : ' bad') : (j === run.i ? ' cur' : '')) + '"></span>';
  }
  $('q-rail').innerHTML = h;
  $('q-apples').innerHTML = applesHTML(left);
  $('q-apples').setAttribute('aria-label', left === 1 ? 'נשאר תפוח אחד' : 'נשארו ' + left + ' תפוחים');
}
function answer(k){
  if (!run || screen !== 'quiz' || (run.pick !== null && run.pick !== undefined)) return;
  var oi = run.op[run.i][k];
  if (!oi) return;
  var ok = oi === 1;
  run.pick = k;
  run.log.push({ q:run.ord[run.i], p:oi, ok:ok });
  if (ok) run.hit++; else run.miss++;
  saveRun();
  paintStatus();
  paintAnswered();
}
function paintAnswered(){
  var L = WORLDS[run.w].levels[run.l], n = L.q.length, Q = L.q[run.ord[run.i]];
  var last = run.log[run.log.length - 1], ok = last.ok, order = run.op[run.i];
  Array.prototype.forEach.call($('q-opts').children, function(b, k){
    b.disabled = true;
    if (order[k] === 1) b.classList.add('right');
    else if (k === run.pick) b.classList.add('wrong');
    else b.classList.add('dim');
  });
  var out = run.miss >= APPLES, end = out || run.i === n - 1;
  var txt = ok
    ? '<span class="verdict ok">' + CHEERS[run.log.length % CHEERS.length] + '</span>'
    : '<span class="verdict no">לא הפעם.</span> התשובה הנכונה: ' + esc(Q[1]) + '.';
  if (Q[5]) txt += ' ' + esc(Q[5]);
  if (out) txt += ' זה היה התפוח האחרון.';
  $('q-fb').innerHTML = txt;
  var nb = $('q-next');
  nb.textContent = end ? 'לסיכום השלב' : 'לשאלה הבאה';
  nb.hidden = false;
  try { nb.focus({ preventScroll:true }); } catch (e) {}
}
function next(){
  if (!run || run.pick === null || run.pick === undefined) return;
  var n = WORLDS[run.w].levels[run.l].q.length;
  if (run.miss >= APPLES || run.i === n - 1) return finish();
  run.i++; run.pick = null;
  saveRun();
  renderQuiz(true);
}
function finish(){
  var w = run.w, l = run.l, L = WORLDS[w].levels[l];
  var failed = run.miss >= APPLES, a = failed ? 0 : APPLES - run.miss;
  var prev = rec(w, l);
  var res = { w:w, l:l, a:a, hit:run.hit, asked:run.log.length, n:L.q.length, failed:failed, log:run.log, first:!prev.a && a > 0 };
  if (a > prev.a || run.hit > prev.b){
    P.lv[w + l] = { a:Math.max(prev.a, a), b:Math.max(prev.b, run.hit) };
    P.lv = clean(P.lv);
    saveLocal();
    pushCloud();
  }
  run = null; saveRun();
  renderResult(res);
}

/* ---------- result ---------- */
function renderResult(r){
  var levels = WORLDS[r.w].levels, L = levels[r.l], hasNext = r.l + 1 < levels.length;
  app.dataset.world = r.w;
  show('result');
  $('r-apples').innerHTML = applesHTML(r.a);
  $('r-apples').setAttribute('aria-label', r.a + ' מתוך 3 תפוחים');
  var title, sub;
  if (r.failed){
    title = 'נגמרו התפוחים';
    sub = 'ענית נכון על ' + r.hit + ' מתוך ' + r.asked + ' שאלות בשלב ״' + L.t + '״. אותן שאלות מחכות לסיבוב נוסף.';
  } else if (r.a === 3){
    title = 'שלושה תפוחים!';
    sub = r.n + ' מתוך ' + r.n + ' בשלב ״' + L.t + '״. גובה של דרדס שלם.';
  } else {
    title = 'עברת את השלב';
    sub = r.hit + ' מתוך ' + r.n + ' בשלב ״' + L.t + '״, ' + (r.a === 2 ? 'ונשארו לך שני תפוחים.' : 'ונשאר לך תפוח אחד.');
  }
  $('r-title').textContent = title;
  $('r-sub').textContent = sub;
  var un = $('r-unlock');
  if (r.first && hasNext){ un.hidden = false; un.textContent = 'נפתח שלב ' + (r.l + 2) + ': ' + levels[r.l + 1].t; }
  else if (r.first && !hasNext){ un.hidden = false; un.textContent = 'זה היה השלב האחרון בעולם של ' + WORLDS[r.w].name + '. כל הכבוד!'; }
  else { un.hidden = true; un.textContent = ''; }

  var canNext = hasNext && passed(r.w, r.l), act = '';
  if (canNext) act += '<button class="btn primary" data-act="next" data-l="' + (r.l + 1) + '">לשלב הבא</button>';
  act += '<button class="btn' + (canNext ? '' : ' primary') + '" data-act="retry" data-l="' + r.l + '">' + (r.failed ? 'לנסות שוב' : 'לשחק שוב את השלב') + '</button>';
  act += '<button class="btn ghost" data-act="map">למפת השלבים</button>';
  var box = $('r-actions');
  box.innerHTML = act;
  box.dataset.w = r.w;

  var misses = r.log.filter(function(e){ return !e.ok; }), rv = $('r-review');
  if (misses.length){
    rv.hidden = false;
    rv.innerHTML = '<h3>השאלות שפספסת</h3><ol>' + misses.map(function(e){
      var Q = L.q[e.q];
      return '<li><span class="rq">' + esc(Q[0]) + '</span><span class="ra">ענית: ' + esc(Q[e.p]) + '</span><span class="rc">נכון: ' + esc(Q[1]) + '</span></li>';
    }).join('') + '</ol>';
  } else { rv.hidden = true; rv.innerHTML = ''; }
  try { $('r-title').focus({ preventScroll:true }); } catch (e) {}
}

/* ---------- events ---------- */
function bind(){
  $('levels').addEventListener('click', function(ev){
    var b = ev.target.closest('.lv');
    if (b && !b.disabled) startLevel(world, +b.dataset.i);
  });
  document.querySelector('.tabs').addEventListener('click', function(ev){
    var b = ev.target.closest('.tab');
    if (!b || b.dataset.world === world) return;
    world = b.dataset.world; saveLocal(); resetIdle(); renderHome();
  });
  $('resume').addEventListener('click', function(ev){
    if (ev.target.id === 'resume-go' && run) renderQuiz(true);
    if (ev.target.id === 'resume-drop'){ run = null; saveRun(); renderHome(); }
  });
  $('reset-area').addEventListener('click', function(ev){
    var id = ev.target.id, area = $('reset-area');
    if (id === 'reset-ask'){
      area.innerHTML = '<span class="ask">מה לאפס? השלבים יינעלו והתפוחים יימחקו.</span>' +
        '<button class="btn small" id="reset-world">רק את ' + esc(WORLDS[world].name) + '</button>' +
        '<button class="btn small" id="reset-all">את כל המשחק</button>' +
        '<button class="btn ghost small" id="reset-no">ביטול</button>';
    } else if (id === 'reset-world' || id === 'reset-all'){
      resetGame(id === 'reset-all' ? 'all' : world);
      resetIdle();
      renderHome();
    } else if (id === 'reset-no'){
      resetIdle();
    }
  });
  $('q-opts').addEventListener('click', function(ev){
    var b = ev.target.closest('.opt');
    if (b) answer(+b.dataset.k);
  });
  $('q-next').addEventListener('click', next);
  $('q-exit').addEventListener('click', function(){
    if (run) world = run.w;
    if (run && !run.log.length){ run = null; saveRun(); }
    saveLocal();
    renderHome();
  });
  $('r-actions').addEventListener('click', function(ev){
    var b = ev.target.closest('button');
    if (!b) return;
    var w = $('r-actions').dataset.w;
    if (b.dataset.act === 'map'){ world = w; saveLocal(); renderHome(); }
    else startLevel(w, +b.dataset.l);
  });
  document.addEventListener('keydown', function(ev){
    if (screen !== 'quiz' || !run || ev.ctrlKey || ev.metaKey || ev.altKey) return;
    if (ev.key >= '1' && ev.key <= '4'){ ev.preventDefault(); answer(+ev.key - 1); }
  });
}

/* ---------- boot ---------- */
function start(data){
  loadLocal();
  if (data && (data.world === 's' || data.world === 'd')) world = data.world;
  if (data && validRun(data.run)) run = data.run;
  bind();
  renderGloss();
  if (data && data.screen === 'quiz' && run) renderQuiz(false); else renderHome();
  initCloud();
}
var hot = window.claude && window.claude.hot;
try { if (hot && hot.snapshot) hot.snapshot(function(){ return { run:run, world:world, screen:screen }; }); } catch (e) {}
if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});

})();

</script>
<script>
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
  window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}
</script>
